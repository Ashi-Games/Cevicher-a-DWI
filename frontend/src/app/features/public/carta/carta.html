<section class="container py-5 page-enter">
  <div class="text-center mb-4">
    <h1 class="section-title text-center">Nuestra carta</h1>
    <p class="text-secondary">Precios en soles. Platos preparados al momento.</p>
  </div>

  <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
    @for (c of categorias; track c) {
      <button type="button" class="btn btn-sm rounded-pill"
              [class.btn-primary]="categoria() === c" [class.btn-outline-primary]="categoria() !== c"
              (click)="categoria.set(c)">{{ c }}</button>
    }
  </div>

  <div class="row g-3">
    @for (p of visibles(); track p.nombre) {
      <div class="col-sm-6 col-lg-4">
        <app-plato-card [plato]="p" />
      </div>
    }
  </div>

  <div class="text-center mt-5">
    <a class="btn btn-coral btn-lg" routerLink="/reservar"><i class="bi bi-calendar-check me-2"></i>Reservar mesa</a>
  </div>
</section>
