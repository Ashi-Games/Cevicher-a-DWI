<div class="panel">
  <!-- Barra superior (solo movil) -->
  <header class="barra-movil d-md-none bg-marino text-white d-flex align-items-center px-3">
    <button class="btn btn-link text-white fs-4 p-0 me-3" type="button" aria-label="Menu" (click)="menuAbierto.set(!menuAbierto())">
      <i class="bi" [class.bi-list]="!menuAbierto()" [class.bi-x-lg]="menuAbierto()"></i>
    </button>
    <span class="fw-semibold">Panel Rinconcito Marino</span>
  </header>

  <aside class="lateral bg-marino text-white" [class.abierto]="menuAbierto()">
    <div class="p-4 d-none d-md-block">
      <div class="fw-bold fs-5"><i class="bi bi-water me-1"></i> Rinconcito</div>
      <small class="opacity-75">Panel de gestión</small>
    </div>
    <nav class="nav flex-column px-2">
      @for (e of enlaces; track e.ruta) {
        @if (!e.soloAdmin || auth.esAdmin()) {
          <a class="nav-link" [routerLink]="e.ruta" routerLinkActive="activo"
             [routerLinkActiveOptions]="{ exact: e.exacto }" (click)="menuAbierto.set(false)">
            <i class="bi {{ e.icono }} me-2"></i>{{ e.texto }}
          </a>
        }
      }
    </nav>
    <div class="mt-auto p-3 border-top border-light border-opacity-25">
      <div class="small mb-2">
        <i class="bi bi-person-circle me-1"></i>{{ auth.sesion()?.usuario }}
        <span class="badge bg-light text-primary ms-1">{{ auth.sesion()?.rol }}</span>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-light flex-fill" routerLink="/" target="_blank"><i class="bi bi-globe"></i> Sitio</a>
        <button class="btn btn-sm btn-light flex-fill" type="button" (click)="auth.logout()"><i class="bi bi-box-arrow-right"></i> Salir</button>
      </div>
    </div>
  </aside>

  @if (menuAbierto()) {
    <div class="velo d-md-none" (click)="menuAbierto.set(false)"></div>
  }

  <main class="principal p-3 p-md-4">
    <router-outlet />
  </main>
</div>
