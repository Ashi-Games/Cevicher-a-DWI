<div class="page-enter">
  <h1 class="h3 fw-bold mb-3">Mesas</h1>
  <div class="row g-3">
    <div class="col-lg-4">
      <form class="card card-soft p-3" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
        <h2 class="h6 fw-bold text-primary">{{ editando() ? 'Editar mesa ' + editando()!.numero : 'Nueva mesa' }}</h2>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label small" for="numero">Número</label>
            <input id="numero" type="number" class="form-control" formControlName="numero" [class.is-invalid]="invalido('numero')">
            <app-field-error [control]="form.get('numero')" />
          </div>
          <div class="col-6">
            <label class="form-label small" for="capacidad">Capacidad</label>
            <input id="capacidad" type="number" class="form-control" formControlName="capacidad" [class.is-invalid]="invalido('capacidad')">
            <app-field-error [control]="form.get('capacidad')" />
          </div>
          <div class="col-12">
            <label class="form-label small" for="zona">Zona</label>
            <input id="zona" class="form-control" formControlName="zona" list="zonas">
            <datalist id="zonas"><option value="Salón"></option><option value="Terraza"></option><option value="Segundo piso"></option></datalist>
          </div>
          <div class="col-12 form-check form-switch ms-2">
            <input id="activa" class="form-check-input" type="checkbox" formControlName="activa">
            <label class="form-check-label small" for="activa">Mesa activa</label>
          </div>
          <div class="col-12 d-flex gap-2 mt-2">
            <button class="btn btn-primary flex-fill" type="submit">{{ editando() ? 'Guardar cambios' : 'Crear mesa' }}</button>
            @if (editando()) { <button class="btn btn-outline-secondary" type="button" (click)="nueva()">Cancelar</button> }
          </div>
        </div>
      </form>
    </div>

    <div class="col-lg-8">
      <div class="row g-2">
        @for (m of mesas(); track m.id) {
          <div class="col-6 col-md-4">
            <div class="card card-soft h-100" [class.opacity-50]="!m.activa">
              <div class="card-body p-3">
                <div class="d-flex justify-content-between">
                  <span class="fw-bold fs-5">Mesa {{ m.numero }}</span>
                  <div class="form-check form-switch m-0" title="Activar / desactivar">
                    <input class="form-check-input" type="checkbox" [checked]="m.activa" (change)="alternarActiva(m)">
                  </div>
                </div>
                <small class="text-secondary"><i class="bi bi-people me-1"></i>{{ m.capacidad }} personas · {{ m.zona || 'Sin zona' }}</small>
                <div class="d-flex gap-1 mt-2">
                  <button class="btn btn-sm btn-outline-primary flex-fill" (click)="editar(m)"><i class="bi bi-pencil"></i></button>
                  <button class="btn btn-sm btn-outline-danger flex-fill" (click)="eliminar(m)"><i class="bi bi-trash"></i></button>
                </div>
              </div>
            </div>
          </div>
        } @empty {
          <p class="text-secondary">No hay mesas registradas.</p>
        }
      </div>
    </div>
  </div>
</div>
