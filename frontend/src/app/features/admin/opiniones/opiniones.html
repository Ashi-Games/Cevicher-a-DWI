<div class="page-enter">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h1 class="h3 fw-bold mb-0">Opiniones <span class="badge text-bg-primary fs-6 align-middle">{{ opiniones().length }}</span></h1>
    <form class="input-group" style="max-width: 320px" (submit)="$event.preventDefault(); buscar(q.value)">
      <input #q class="form-control" placeholder="Buscar por nombre, correo o texto">
      <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
    </form>
  </div>

  @if (cargando()) {
    <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
  } @else {
    <div class="row g-3">
      @for (o of opiniones(); track o.id) {
        <div class="col-md-6 col-xl-4">
          <div class="card card-soft h-100">
            <div class="card-body d-flex flex-column">
              <p class="flex-grow-1"><i class="bi bi-quote text-coral fs-4"></i> {{ o.comentario }}</p>
              <div class="d-flex justify-content-between align-items-end">
                <div>
                  <div class="fw-semibold">{{ o.nombres }}</div>
                  <small class="text-secondary">{{ o.correo }} · {{ o.fechaRegistro | date: 'dd/MM/yyyy' }}</small>
                </div>
                @if (auth.esAdmin()) {
                  <button class="btn btn-sm btn-outline-danger" title="Eliminar" (click)="eliminar(o)"><i class="bi bi-trash"></i></button>
                }
              </div>
            </div>
          </div>
        </div>
      } @empty {
        <p class="text-secondary">No hay opiniones.</p>
      }
    </div>
  }
</div>
