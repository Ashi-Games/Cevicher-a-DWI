<div class="fondo d-flex align-items-center justify-content-center p-3">
  <div class="card card-soft p-4 p-md-5 w-100 page-enter" style="max-width: 420px">
    <div class="text-center mb-4">
      <i class="bi bi-water fs-1 text-primary"></i>
      <h1 class="h4 fw-bold mt-2 mb-0">Panel Rinconcito Marino</h1>
      <p class="text-secondary small">Acceso solo para el personal</p>
    </div>
    <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="usuario">Usuario</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input id="usuario" class="form-control" formControlName="usuario" autocomplete="username" [class.is-invalid]="invalido('usuario')">
        </div>
        <app-field-error [control]="form.get('usuario')" />
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-key"></i></span>
          <input id="password" class="form-control" formControlName="password" autocomplete="current-password"
                 [type]="verPassword() ? 'text' : 'password'" [class.is-invalid]="invalido('password')">
          <button class="btn btn-outline-secondary" type="button" (click)="verPassword.set(!verPassword())" aria-label="Mostrar contraseña">
            <i class="bi" [class.bi-eye]="!verPassword()" [class.bi-eye-slash]="verPassword()"></i>
          </button>
        </div>
        <app-field-error [control]="form.get('password')" />
      </div>
      <button class="btn btn-primary w-100 btn-lg" type="submit" [disabled]="cargando()">
        @if (cargando()) { <span class="spinner-border spinner-border-sm me-2"></span> }
        Ingresar
      </button>
    </form>
    <a class="d-block text-center small mt-4" routerLink="/"><i class="bi bi-arrow-left me-1"></i>Volver al sitio</a>
  </div>
</div>
