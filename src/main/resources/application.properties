spring.application.name=marino

# Base de datos MySQL local (Hibernate construye las tablas)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rinconcito_marino?createDatabaseIfNotExist=true&sslMode=DISABLED&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT (clave de desarrollo, minimo 32 caracteres)
app.jwt.secret=rinconcito-marino-clave-jwt-solo-desarrollo-2026
app.jwt.expiration-minutes=480

# Administrador inicial (se crea al arrancar si no existe)
app.admin.bootstrap.user=admin
app.admin.bootstrap.password=Admin2026
app.admin.bootstrap.role=ADMIN

# CORS: frontend Angular en la PC y en el celular (misma red WiFi)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://192.168.*.*:4200,http://10.*.*.*:4200}

